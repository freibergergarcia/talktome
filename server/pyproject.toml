[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "talktome-server"
version = "0.2.0"
description = "Self-hosted speech-to-text for TalkToMe: Parakeet on Apple Silicon behind an OpenAI-compatible endpoint."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "numpy>=2.0",
]

[project.optional-dependencies]
# The model runtime: Apple's MLX for the encoder on the GPU, and the Hugging
# Face client to fetch the weights. Apple Silicon only; kept optional so the
# HTTP layer, the NumPy front end and decoder, and their tests install anywhere.
mlx = ["mlx>=0.32.3,<0.33", "huggingface_hub>=0.24"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
talktome-server = "talktome_server.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/talktome_server"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter declarations are meant to be called in defaults.
extend-immutable-calls = ["fastapi.File", "fastapi.Form", "fastapi.Depends"]
